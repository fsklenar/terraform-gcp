defaults
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# HTTP -> redirect na HTTPS (toto musí byť mode http)
frontend http_in
    bind *:80
    mode http
    redirect scheme https code 301

# HTTPS -> passthrough (mode tcp, HAProxy nevidí obsah)
frontend https_in
    bind *:443
    mode tcp
    default_backend app_tls

backend app_tls
    mode tcp
    server s1 10.14.0.5:8043 check
